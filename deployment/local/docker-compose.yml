# OpenCEM compose stack

# logging
x-logging: &default-logging
  logging:
    driver: json-file
    options:
      max-size: "5m"
      max-file: "10"

# services to deploy
services:
  # CEM
  cem:
    <<: *default-logging
    restart: unless-stopped
    image: ghcr.io/open-cem/open-cem:latest
    ports:
      - '127.0.0.1:8000:8000'
    environment:
      MQTT_HOST: mqtt
      MQTT_PORT: 1883
      INFLUX_HOST: influxdb
      INFLUX_PORT: 8086
      HTTP_HOST: '0.0.0.0'
      HTTP_PORT: 8000
      LOOP_TIME: 60
      SIMULATION_SPEED: 1.0
    depends_on:
      - mqtt
      - influxdb
  # MQTT broker
  mqtt:
    <<: *default-logging
    restart: unless-stopped
    image: eclipse-mosquitto:2.1-alpine
    # disabled authentication for testing purposes
    command: /usr/sbin/mosquitto -c /mosquitto-no-auth.conf
    ports:
      - '127.0.0.1:1883:1883'
  # InfluxDB V1
  influxdb:
    <<: *default-logging
    restart: unless-stopped
    image: influxdb:1.13
    ports:
      - '127.0.0.1:8086:8086'
    environment:
      INFLUXDB_REPORTING_DISABLED: true
      INFLUXDB_HTTP_AUTH_ENABLED: false
      INFLUXDB_HTTP_LOG_ENABLED: true
