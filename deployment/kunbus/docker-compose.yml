# OpenCEM compose stack for Kunbus Revolution Pi

# logging
x-logging: &default-logging
  logging:
    driver: json-file
    options:
      max-size: "5m"
      max-file: "10"

# services to deploy
services:
  # CEM
  cem:
    <<: *default-logging
    restart: unless-stopped
    image: ghcr.io/open-cem/open-cem:latest
    volumes:
      - cem-config:/data/config:rw
      - cem-xml:/data/xml:rw
    ports:
      # expose web GUI
      - '8000:8000'
    #devices:
    #  # pass through serial port
    #  - "/dev/ttyS0:/dev/serial0"
    environment:
      CONFIG_PATH: /data/config
      XML_PATH: /data/xml
      MQTT_HOST: mqtt
      MQTT_PORT: 1883
      INFLUX_HOST: influxdb
      INFLUX_PORT: 8086
      HTTP_HOST: '0.0.0.0'
      HTTP_PORT: 8000
      LOOP_TIME: 60
      SIMULATION_SPEED: 1.0
    depends_on:
      - mqtt
      - influxdb
  # MQTT broker
  mqtt:
    <<: *default-logging
    restart: unless-stopped
    image: eclipse-mosquitto:2.1-alpine
    # disabled authentication for testing purposes
    command: /usr/sbin/mosquitto -c /mosquitto-no-auth.conf
  # InfluxDB V1
  influxdb:
    <<: *default-logging
    restart: unless-stopped
    image: influxdb:1.13
    volumes:
      - influx-data:/var/lib/influxdb:rw
      - influx-config:/etc/influxdb:rw
    ports:
      # expose InfluxDB
      - '8086:8086'
    environment:
      INFLUXDB_REPORTING_DISABLED: true
      INFLUXDB_HTTP_AUTH_ENABLED: false
      INFLUXDB_HTTP_LOG_ENABLED: false

# persistent volumes
volumes:
  cem-config:
    driver: local
  cem-xml:
    driver: local
  influx-data:
    driver: local
  influx-config:
    driver: local
